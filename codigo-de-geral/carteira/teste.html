<body>
  <header>
    <div id="marca">
      <h1>💰 Investe Plus</h1>
      <p id="slogan">Saúde financeira e investimentos</p>
    </div>
  </header>

  <nav>
    <a href="../inicio/index.html">Inicio</a>
    <a href="#" target="_self">Carteira</a>
    <a href="../sobre/index.html">Dicas de Investimento</a>
    <a href="../sobre/index.html">Sobre Nós</a>
  </nav>

  <main>
    <section id="carteira">
      <div id="cadastroMovimentacao">
        <h3>Cadastro de Movimentação</h3>

        <label>Data:</label>
        <input type="date" id="dataMov">

        <label>Descrição:</label>
        <input type="text" id="descricaoMov" maxlength="50">

        <label>Tipo:</label>
        <select id="tipoMov">
          <option value="" disabled selected>Selecione</option>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <label>Valor:</label>
        <input type="number" id="valorMov">

        <button onclick="cadastrarMov()">Salvar</button>
      </div>

      <div id="chart">
        <canvas id="graficoPizza"></canvas>
        <canvas id="graficoLinha"></canvas>
      </div>

      <div class="card">
        <h4>Histórico de Movimentações</h4>
        <table border="1">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Tipo</th>
              <th>Valor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaMov"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>© Investe Mais — Projetado para ajudar você a crescer financeiramente.</p>
  </footer>
